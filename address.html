<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery Address | Joel Frame Work's</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="checkout-page"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img class="brand-logo-image" src="assets/joel-logo.png" alt="Joel Frame Work's"></a><nav class="nav"><a href="index.html">Home</a><a href="index.html#products">All Products</a></nav></div></header><main class="checkout-main"><div class="container checkout-container"><div class="checkout-progress"><div class="checkout-step is-done"><span>✓</span><small>Cart</small></div><i></i><div class="checkout-step is-current"><span>2</span><small>Address</small></div><i></i><div class="checkout-step"><span>3</span><small>Payment</small></div></div><div class="checkout-layout"><section class="checkout-left"><div class="checkout-heading"><p class="eyebrow">DELIVERY INFORMATION</p><h1>Where should we deliver?</h1><p>Enter your details carefully so your frames reach you safely.</p></div><div class="checkout-card"><form id="addressForm" class="checkout-address-form"><label>Full name<input id="customerName" required autocomplete="name" placeholder="Enter your full name"></label><div class="checkout-two-fields"><label>Mobile number<input id="customerPhone" required inputmode="tel" autocomplete="tel" placeholder="10-digit mobile number"></label><label>PIN code<input id="customerPincode" required inputmode="numeric" maxlength="6" placeholder="6-digit PIN code"></label></div><label>Flat, house number, building<input id="customerLine1" required placeholder="House / Flat / Floor"></label><label>Area, street, locality<input id="customerLine2" required placeholder="Street / Area / Locality"></label><div class="checkout-two-fields"><label>Town / City<input id="customerCity" required autocomplete="address-level2" placeholder="City"></label><label>State<input id="customerState" required autocomplete="address-level1" placeholder="State"></label></div><label>Landmark (optional)<input id="customerLandmark" placeholder="Nearby landmark"></label><div id="addressStatus" class="checkout-status" hidden></div><button class="checkout-pay-button" id="saveAddressButton" type="submit">SAVE ADDRESS & CONTINUE <span>→</span></button></form></div></section><aside class="checkout-summary"><div class="checkout-card-title"><h2>Order total</h2><span id="addressOrderType">ORDER</span></div><div class="checkout-summary-product"><div class="checkout-summary-thumb" id="addressThumb">JF</div><div><strong id="addressItemName"></strong><small id="addressItemDescription"></small><small id="addressOrderId"></small></div></div><div class="checkout-summary-lines"><div><span>Item total</span><strong id="addressSubtotal"></strong></div><div class="checkout-total"><span>Total</span><strong id="addressTotal"></strong></div></div></aside></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="order-notifications.js"></script><script src="address.js"></script></body></html>
